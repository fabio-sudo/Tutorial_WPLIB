    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/Telescopio9458LogIntegrationTest.class'
    environment 'HALSIM_EXTENSIONS', ''
    systemProperty 'telescopio9458.validationDir', layout.buildDirectory.dir('telescopio9458-validation').get().asFile.absolutePath
    outputs.file(layout.buildDirectory.file('telescopio9458-validation/FisicoVirtual9458-Teste.wpilog'))
}
tasks.named('check') { dependsOn telescopio9458LogTest }

// Shooter em JVM isolada: grava um tiro e confere as chaves do layout FRC9460-Shooter.
def shooterLogTest = tasks.register('shooterLogTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/ShooterLogIntegrationTest.class'
    environment 'HALSIM_EXTENSIONS', ''
    systemProperty 'shooter.validationDir', layout.buildDirectory.dir('shooter-validation').get().asFile.absolutePath
    inputs.file('config/advantagescope/layouts/FRC9460-Shooter.json')
    outputs.file(layout.buildDirectory.file('shooter-validation/Shooter-Teste.wpilog'))
