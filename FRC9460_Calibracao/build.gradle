tasks.named('check') { dependsOn shooterLogTest }

// Robô inteiro em JVM isolada: coleta, tiro, contagem pelos sensores e chaves dos layouts.
def cicloDaBolaTest = tasks.register('cicloDaBolaTest', Test) {
    inputs.dir('config/advantagescope/layouts')
    inputs.file('config/advantagescope/layouts/FRC9460-TesteFisicoVsModelo.json')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/CicloDaBolaIntegrationTest.class'
    environment 'HALSIM_EXTENSIONS', ''
    systemProperty 'cicloDaBola.validationDir', layout.buildDirectory.dir('ciclo-da-bola').get().asFile.absolutePath
    inputs.file('config/advantagescope/layouts/FRC9460-Shooter.json')
    inputs.file('config/advantagescope/layouts/FRC9460-CicloDaBola.json')
    inputs.dir('src/main/deploy')
    inputs.dir('config/elastic/layouts')
    outputs.file(layout.buildDirectory.file('ciclo-da-bola/CicloDaBola-Teste.wpilog'))
    outputs.file(layout.buildDirectory.file('ciclo-da-bola/validacao-resumo.json'))
