plugins {
    id "java"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Identifica exatamente as fontes/configurações que produziram cada log.
// Funciona também numa cópia do projeto sem a pasta .git.
def buildInfoDir = layout.buildDirectory.dir('generated/build-info')
def generateBuildInfo = tasks.register('generateBuildInfo') {
    inputs.files(fileTree('src/main'), fileTree('vendordeps'), file('build.gradle'))
    outputs.dir(buildInfoDir)
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        inputs.files.files.findAll { it.isFile() }.sort { relativePath(it) }.each { source ->
            digest.update(relativePath(source).replace('\\', '/').getBytes('UTF-8'))
            digest.update((byte) 0)
            digest.update(source.bytes)
        }
        def output = buildInfoDir.get().file('frc9460-build.properties').asFile
        output.parentFile.mkdirs()
        output.text = "SourceSHA256=${digest.digest().encodeHex()}\nBuiltAtUTC=${java.time.Instant.now()}\n"
    }
}
sourceSets.main.resources.srcDir(buildInfoDir)
tasks.named('processResources') { dependsOn generateBuildInfo }

def ROBOT_MAIN_CLASS = "frc.robot.Main"

// Replay é explícito e vale somente para a execução solicitada.
// Exemplo: simulateJava -PreplayLog="C:/caminho/coleta.wpilog"
def replayRequested = project.hasProperty("replayLog") || "REPLAY".equalsIgnoreCase(System.getenv("FRC9460_MODE")?.trim())

tasks.withType(JavaExec).configureEach {
    if (project.hasProperty("replayLog")) {
        // "Copiar como caminho" do Windows põe aspas: tira antes de resolver.
        def replayLogPath = project.property("replayLog").toString().trim().replaceAll(/^["']|["']$/, '')
        environment "FRC9460_MODE", "REPLAY"
        environment "AKIT_LOG_PATH", project.file(replayLogPath).absolutePath
    }
}

task(replayWatch, type: JavaExec) {
    mainClass = "org.littletonrobotics.junction.ReplayWatch"
    classpath = sourceSets.main.runtimeClasspath
    environment "FRC9460_MODE", "REPLAY"
}



// Define my targets (RoboRIO) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.frc.getTeamNumber()
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                frcJava(getArtifactTypeClass('FRCJavaArtifact')) {
                }

                // Static files artifact
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/lvuser/deploy'
                    deleteOldFiles = false // Change to true to delete files on roboRIO that no
                                           // longer exist in deploy directory of this project
                }

                // Painéis do Elastic: ficam em config/elastic/layouts e, no robô, em
                // deploy/elastic, de onde o Robot.java serve na porta 5800.
                elasticLayoutsDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('config/elastic/layouts')
                    directory = '/home/lvuser/deploy/elastic'
                    deleteOldFiles = false
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcJava

// Set to true to use debug for all targets including JNI, which will drastically impact
// performance.
wpi.java.debugJni = false

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
// Also defines JUnit 5.
dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    // Lê o arquivo AdvantageKit.json e pega a versão instalada
    def akitJson = new groovy.json.JsonSlurper().parseText(
        new File(projectDir.getAbsolutePath() + "/vendordeps/AdvantageKit.json").text
    )

    // Ativa o processador necessário para usar @AutoLog
    annotationProcessor "org.littletonrobotics.akit:akit-autolog:$akitJson.version"
    
    roborioDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.roborio)
    roborioDebug wpi.java.vendor.jniDebug(wpi.platforms.roborio)

    roborioRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.roborio)
    roborioRelease wpi.java.vendor.jniRelease(wpi.platforms.roborio)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    exclude '**/VisionReplayIntegrationTest.class'
    exclude '**/TelescopioLogIntegrationTest.class'
    exclude '**/TelescopioReplayIntegrationTest.class'
    exclude '**/Telescopio9458LogIntegrationTest.class'
    exclude '**/ShooterLogIntegrationTest.class'
    exclude '**/CicloDaBolaIntegrationTest.class'
    exclude '**/RobotReplayIntegrationTest.class'
    // AdvantageScopeLayoutFormatTest lê estes arquivos: mudou um layout, roda de novo.
    inputs.dir('config/advantagescope/layouts')
    inputs.file('config/advantagescope/mecanismos/Robot_Robo_9460/config.json')
}

// O GradleRIO já imprime uma linha por teste (PASSED / FAILED / SKIPPED).
// Aqui: erro completo de quem falha e um resumo no fim de cada tarefa de teste.
// Vale para o test e para os testes de integração abaixo. O deploy não roda
// testes (fica rápido). Para forçar rodar de novo: "gradlew test --rerun".
tasks.withType(Test).configureEach { testTask ->
    testLogging {
        exceptionFormat 'full'
    }
    afterSuite { desc, result ->
        if (desc.parent == null) {
            println "== ${testTask.name}: ${result.testCount} testes, ${result.successfulTestCount} OK, " +
                "${result.failedTestCount} falharam, ${result.skippedTestCount} pulados =="
        }
    }
}

// Sem mudança no código, o Gradle não roda os testes de novo (UP-TO-DATE) e
// não imprime nada. Este resumo, no fim do test/build, mostra sempre o
// resultado de cada tarefa de teste: o desta execução ou o último guardado.
def resumoDosTestes = tasks.register('resumoDosTestes') {
    description = 'Resumo de todas as tarefas de teste deste build, mesmo as que não precisaram rodar.'
    mustRunAfter tasks.withType(Test)
    doLast {
        def testTasks = tasks.withType(Test).findAll { gradle.taskGraph.hasTask(it) }
        if (testTasks.isEmpty()) return
        int total = 0, failed = 0, totalSkipped = 0
        def failedTasks = []
        println ''
        println '==================== RESUMO DOS TESTES ===================='
        testTasks.each { t ->
            int count = 0, problems = 0, skipped = 0
            fileTree(t.reports.junitXml.outputLocation).matching { include '*.xml' }.each { file ->
                def suite = new groovy.xml.XmlSlurper().parse(file)
                count += suite.@tests.toInteger()
                problems += suite.@failures.toInteger() + suite.@errors.toInteger()
                skipped += suite.@skipped.toInteger()
            }
            total += count
            failed += problems
            totalSkipped += skipped
            if (t.state.failure != null) failedTasks.add(t.name)
            def origem = t.state.upToDate ? 'sem mudanca, ultimo resultado' : 'rodou agora'
            println String.format('  %-22s %4d testes  %4d OK  %d falharam  (%s)',
                t.name, count, count - problems - skipped, problems, origem)
        }
        println failed == 0 && failedTasks.isEmpty()
            ? "  TUDO OK: ${total - totalSkipped} testes passaram; ${totalSkipped} pulados."
            : "  ATENCAO: ${failed} teste(s) falharam; tarefas com falha: ${failedTasks}."
        println '==========================================================='
    }
}
tasks.withType(Test).configureEach { finalizedBy resumoDosTestes }

// O Logger é global e só inicia uma vez por JVM. O teste de arquivo/replay
// usa outro processo para não alterar o relógio dos testes de simulação normal.
def visionReplayTest = tasks.register('visionReplayTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/VisionReplayIntegrationTest.class'
    environment 'HALSIM_EXTENSIONS', ''
    systemProperty 'replay.validationDir', layout.buildDirectory.dir('replay-validation').get().asFile.absolutePath
    outputs.dir(layout.buildDirectory.dir('replay-validation'))
}
tasks.named('check') { dependsOn visionReplayTest }

// Cada teste de arquivo usa uma JVM própria, pois o Logger é global.
def telescopioLogTest = tasks.register('telescopioLogTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/TelescopioLogIntegrationTest.class'
    environment 'HALSIM_EXTENSIONS', ''
    systemProperty 'telescopio.validationDir', layout.buildDirectory.dir('telescopio-validation').get().asFile.absolutePath
    outputs.file(layout.buildDirectory.file('telescopio-validation/Telescopio9460-Simulacao.wpilog'))
}
def telescopioReplayTest = tasks.register('telescopioReplayTest', Test) {
    dependsOn telescopioLogTest
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/TelescopioReplayIntegrationTest.class'
    environment 'HALSIM_EXTENSIONS', ''
    systemProperty 'telescopio.validationDir', layout.buildDirectory.dir('telescopio-validation').get().asFile.absolutePath
    inputs.file(layout.buildDirectory.file('telescopio-validation/Telescopio9460-Simulacao.wpilog'))
    outputs.file(layout.buildDirectory.file('telescopio-validation/Telescopio9460-Replay.wpilog'))
}
tasks.named('check') { dependsOn telescopioReplayTest }

