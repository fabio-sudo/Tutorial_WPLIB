    dependsOn cicloDaBolaTest
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/RobotReplayIntegrationTest.class'
    environment 'HALSIM_EXTENSIONS', ''
    systemProperty 'cicloDaBola.validationDir', layout.buildDirectory.dir('ciclo-da-bola').get().asFile.absolutePath
    inputs.file(layout.buildDirectory.file('ciclo-da-bola/CicloDaBola-Teste.wpilog'))
    outputs.file(layout.buildDirectory.file('ciclo-da-bola/CicloDaBola-Teste_replay.wpilog'))
}
tasks.named('check') { dependsOn robotReplayTest }

// Simulation configuration (e.g. environment variables).
wpi.sim.addGui().defaultEnabled = !replayRequested
wpi.sim.addDriverstation().defaultEnabled = false

// Setting up my Jar File. In this case, adding all libraries into the main jar ('fat jar')
// in order to make them all available at runtime. Also adding the manifest so WPILib
// knows where to look for our Robot Class.
jar {
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    from('src') { into 'backup/src' }
    from('vendordeps') { into 'backup/vendordeps' }
    from('build.gradle') { into 'backup' }
    manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Configure jar and deploy tasks
deployArtifact.jarTask = jar
wpi.java.configureExecutableTasks(jar)
wpi.java.configureTestTasks(test)
wpi.java.configureTestTasks(visionReplayTest.get())
wpi.java.configureTestTasks(telescopioLogTest.get())
wpi.java.configureTestTasks(telescopioReplayTest.get())
wpi.java.configureTestTasks(telescopio9458LogTest.get())
wpi.java.configureTestTasks(shooterLogTest.get())
wpi.java.configureTestTasks(cicloDaBolaTest.get())
wpi.java.configureTestTasks(robotReplayTest.get())

// Configure string concat to always inline compile
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs.add '-XDstringConcat=inline'
}
